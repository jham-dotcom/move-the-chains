name: Weekly data refresh
# Every Tuesday morning (after Monday Night Football), pull the latest nflverse data,
# re-grade every snap and republish index.html. GitHub Pages serves the new version automatically.
on:
  schedule:
    - cron: "17 11 * * 2"   # Tuesdays 11:17 UTC (6:17 a.m. Eastern in winter)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: bash pipeline/run_all.sh
      - name: Commit the new page if anything changed
        run: |
          git config user.name "move-the-chains-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
